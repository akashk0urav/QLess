services:

  db:
    image: mysql:8.0
    container_name: qless_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpw
      MYSQL_DATABASE: qless
      MYSQL_USER: qless_user
      MYSQL_PASSWORD: qless_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

  redis:
    image: redis:7-alpine
    container_name: qless_redis
    restart: always
    ports:
      - "6379:6379"

  web:
    build: .
    container_name: qless_web
    restart: always
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
      - redis

volumes:
  mysql_data: